# People list for the /people/ page.
#
# HOW TO EDIT
#   Add someone:     copy an entry (from "- name:" down to "group:"), paste it, change the details.
#   Remove someone:  delete their whole entry.
#   Move to alumni:  change their group to alumni (and their role if you like).
#
# FIELDS
#   name:   Full name (shown in bold)
#   role:   Job title, shown under the name
#   image:  File name inside /images/  (leave blank to use holding.png)
#   url:    Website/profile link, or mailto:someone@ucl.ac.uk  (leave blank for no link)
#   group:  One of: academic, affiliated, researcher, administrative, doctoral, honorary,
#           past-faculty, alumni
#
# People appear on the page in the order they are listed here (currently alphabetical by surname).

